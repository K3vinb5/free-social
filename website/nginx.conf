# Server block for the Free Social static site.
# Installed as /etc/nginx/conf.d/default.conf inside the image.
#
# Caching is expressed with `expires` rather than `add_header Cache-Control` on
# purpose: `add_header` in a location discards every inherited header, which
# would silently drop the security headers below. `expires` does not.

server {
    listen      80;
    listen      [::]:80;
    server_name freesocial.k3vinb5.dev _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # -------------------------------------------------------------- mime
    # A `types { ... }` block at server or location level REPLACES the map
    # inherited from http { include mime.types; }, so the stock map is pulled
    # in here first and the extra mapping is added next to it. Without this,
    # .apk falls back to octet-stream and Android browsers offer to "open" the
    # package instead of saving it. .zip is already application/zip in the
    # stock map, so it is not repeated (nginx warns about duplicate types).
    include /etc/nginx/mime.types;
    types {
        application/vnd.android.package-archive apk;
    }

    # ---------------------------------------------------------------- gzip
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # --------------------------------------------------------- security
    add_header X-Content-Type-Options     "nosniff"                         always;
    add_header X-Frame-Options            "SAMEORIGIN"                      always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # TLS terminates at the reverse proxy; the header still reaches the browser over https.
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    # The page ships two small inline <script> blocks and inline style attributes,
    # so 'unsafe-inline' is required for script-src and style-src.
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---------------------------------------------------------- caching
    # Regular expressions are matched in order of appearance, so the more
    # specific font rule must come before the general assets rule.

    # Fonts never change under a given filename.
    location ~* ^/assets/fonts/ {
        try_files $uri =404;
        expires 30d;
    }

    # Versioned release artifacts.
    location ^~ /downloads/ {
        try_files $uri =404;
        expires 30d;
    }

    # The download manifest lives at a fixed URL and changes on every publish,
    # so it cannot inherit the month-long cache of the versioned files next to
    # it. Exact match, so it wins over the prefix block above.
    location = /downloads/versions.json {
        try_files $uri =404;
        expires 5m;
    }

    # Screenshots, logo, stylesheet: shorter, because filenames are not fingerprinted.
    location ~* ^/(assets/|styles\.css$) {
        try_files $uri =404;
        expires 7d;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico {
        access_log off;
        try_files /assets/mark.svg =404;
        default_type image/svg+xml;
        expires 7d;
    }

    # The document must revalidate so a deploy is visible immediately.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
        expires 1h;
    }

    error_page 404 /index.html;
}
