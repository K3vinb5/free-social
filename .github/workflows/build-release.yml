name: Build & Release (reusable)

# Shared delivery mechanics for release.yml (versioned release) and
# nightly.yml (commit-hash prerelease). Builds, tests, packages and publishes.
# Artifacts are signed release builds (never debug builds): the keystore is
# decoded from repository secrets on the runner and never committed.
on:
  workflow_call:
    inputs:
      tag_name:
        description: Tag to publish (created by gh at the built commit if it does not exist)
        required: true
        type: string
      release_name:
        description: Release title (defaults to the tag name)
        required: false
        type: string
        default: ""
      prerelease:
        description: Mark the release as a prerelease
        required: false
        type: boolean
        default: false
      changelog_from:
        description: Optional ref to start the changelog range at (defaults to the previous tag)
        required: false
        type: string
        default: ""

# No workflow-level permissions: every job declares exactly what it needs
# (a workflow-level block would cap the packages: write granted below).
# SDK setup lives in .github/actions/android-setup (shared with ci.yml).

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha: ${{ steps.package.outputs.sha }}
      zip: ${{ steps.package.outputs.zip }}
      apk: ${{ steps.package.outputs.apk }}
    steps:
      - name: Resolve checkout ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ] && gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "ref=refs/tags/${TAG}" >> "$GITHUB_OUTPUT"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "checking out existing tag ${TAG}"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "tag ${TAG} does not exist yet; building ${GITHUB_SHA}"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Set up Android build environment
        uses: ./.github/actions/android-setup

      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.FREE_SOCIAL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FREE_SOCIAL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FREE_SOCIAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FREE_SOCIAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=("FREE_SOCIAL_KEYSTORE_B64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("FREE_SOCIAL_KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("FREE_SOCIAL_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("FREE_SOCIAL_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing release signing secrets: ${missing[*]}"
            echo "Releases must be signed release builds, not debug builds." >&2
            echo "Set each one with: gh secret set <NAME>  (value on stdin)" >&2
            exit 1
          fi
          echo "All four release signing secrets are present."

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.FREE_SOCIAL_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/freesocial-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          test -s "$keystore" || { echo "::error::decoded keystore is empty"; exit 1; }
          echo "FREE_SOCIAL_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "Decoded the release keystore for this job."

      - name: Test and build signed release APK
        env:
          FREE_SOCIAL_KEYSTORE_FILE: ${{ runner.temp }}/freesocial-release.jks
          FREE_SOCIAL_KEYSTORE_PASSWORD: ${{ secrets.FREE_SOCIAL_KEYSTORE_PASSWORD }}
          FREE_SOCIAL_KEY_ALIAS: ${{ secrets.FREE_SOCIAL_KEY_ALIAS }}
          FREE_SOCIAL_KEY_PASSWORD: ${{ secrets.FREE_SOCIAL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test assembleRelease

      - name: Package artifact
        id: package
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          # `version` is the app's versionName: it is what the site records in
          # versions.json and prints in the download table (nightlies are never
          # bumped, so they inherit the release line they were cut from).
          version_name="$(sed -nE 's/^.*versionName *= *"([^"]+)".*$/\1/p' app/build.gradle.kts | head -n1)"
          [ -n "$version_name" ] || { echo "::error::cannot read versionName from app/build.gradle.kts"; exit 1; }

          # The packaged zip name keeps its tag-derived label so it matches
          # tools/release/package.sh and tools/release/README.md:
          #   v0.4.1                    -> free-social-0.4.1-<sha>.zip
          #   nightly-YYYYMMDD-<sha>    -> free-social-nightly-YYYYMMDD-<sha>.zip
          if [[ "$TAG" =~ ^nightly-([0-9]{8})-([0-9A-Za-z._-]+)$ ]]; then
            artifact_version="nightly-${BASH_REMATCH[1]}"
            echo "nightly tag ${TAG} -> artifact label ${artifact_version}"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            artifact_version="${TAG#v}"
          else
            echo "::error::tag '$TAG' is neither vX.Y.Z nor nightly-YYYYMMDD-<sha>"
            exit 1
          fi

          sha="$(git rev-parse --short HEAD)"
          zip="$(tools/release/package.sh "$artifact_version" "$sha" dist)"
          {
            echo "version=$version_name"
            echo "sha=$sha"
            echo "zip=$zip"
            echo "apk=app/build/outputs/apk/release/app-release.apk"
          } >> "$GITHUB_OUTPUT"
          unzip -l "$zip"

      # The site uploader takes a flat directory holding app-release.apk plus any
      # *.zip (tools/release/publish_downloads.sh). upload-artifact roots the
      # artifact at the least common ancestor of its paths, so uploading the two
      # build paths directly would preserve app/build/outputs/... and dist/ inside
      # the artifact. Copy both into one flat dir and upload that instead.
      - name: Stage publish artifacts
        env:
          ZIP: ${{ steps.package.outputs.zip }}
          APK: ${{ steps.package.outputs.apk }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release-artifacts"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -f "$ZIP" "$stage/$(basename "$ZIP")"
          cp -f "$APK" "$stage/app-release.apk"
          test -s "$stage/app-release.apk"
          ls -la "$stage"

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          # flat: app-release.apk + free-social-<label>-<sha>.zip, as built above
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Compose release notes
        env:
          CHANGELOG_FROM: ${{ inputs.changelog_from }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          tools/release/changelog.sh "$CHANGELOG_FROM" "$(git rev-parse HEAD)" "$TAG_NAME" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          TAG_EXISTS: ${{ steps.ref.outputs.tag_exists }}
          ZIP: ${{ steps.package.outputs.zip }}
          APK: ${{ steps.package.outputs.apk }}
        run: |
          set -euo pipefail
          title="${RELEASE_NAME:-$TAG}"
          args=(--title "$title" --prerelease="$PRERELEASE" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$TAG_EXISTS" != "true" ]; then
            args+=(--target "$(git rev-parse HEAD)")
          fi
          gh release create "$TAG" "${args[@]}" "$ZIP" "$APK"

  # Publishes the artifacts just built to the static site: the APK/zip and
  # versions.json under website/downloads/, then lands that commit on master
  # through a pull request (master is protected; see
  # tools/release/bookkeeping_pr.sh) so the site build picks up the merged sha.
  # The download tables are rendered from versions.json when the site image is
  # built, so no HTML is committed here. Tags are never pushed here.
  publish-site:
    needs: release
    runs-on: ubuntu-latest
    # The bookkeeping PR has to wait for ci.yml's build-test, so this is a
    # long-running job by design; bounded so a stuck check fails instead of hangs.
    timeout-minutes: 45
    permissions:
      contents: write      # push the throwaway branch
      pull-requests: write # open and squash-merge the bookkeeping PR
      actions: write       # dispatch ci.yml on the branch
      checks: read         # poll the build-test check run
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
      version: ${{ steps.kind.outputs.version }}
      sha: ${{ steps.kind.outputs.sha }}
      commit: ${{ steps.commit.outputs.commit }}
      short: ${{ steps.commit.outputs.short }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # The landing helper comes from the revision this pipeline was dispatched
      # with, not from the master tree: nightly.yml may be dispatched on a branch
      # (publish-site still commits on top of master), and on the first run after
      # a change to this workflow master does not carry the helper yet.
      - name: Stage the bookkeeping helper
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/bookkeeping_pr.sh"
          if git cat-file -e "${GITHUB_SHA}:tools/release/bookkeeping_pr.sh" 2>/dev/null; then
            git show "${GITHUB_SHA}:tools/release/bookkeeping_pr.sh" > "$helper"
          else
            cp tools/release/bookkeeping_pr.sh "$helper"
          fi
          chmod +x "$helper"
          echo "BOOKKEEPING_HELPER=$helper" >> "$GITHUB_ENV"
          echo "helper staged from ${GITHUB_SHA}"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release-artifacts

      - name: Detect release kind
        id: kind
        env:
          TAG: ${{ inputs.tag_name }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          # nightly-YYYYMMDD-<sha> is the only nightly shape
          # (tools/release/publish_downloads.sh uses the same pattern for the files
          # it serves). Anything else is a versioned release tag.
          if [[ "$TAG" =~ ^nightly-([0-9]{8})-([0-9A-Za-z._-]+)$ ]]; then
            kind=nightly
            echo "nightly tag: date ${BASH_REMATCH[1]}, build ${BASH_REMATCH[2]}"
          elif [[ "$TAG" =~ ^nightly- ]]; then
            echo "::error::nightly tag '$TAG' is not nightly-YYYYMMDD-<sha>"
            exit 1
          else
            kind=release
          fi
          [ -n "$SHA" ] || { echo "::error::the release job reported no build sha"; exit 1; }
          [ -n "$VERSION" ] || { echo "::error::the release job reported no version"; exit 1; }
          echo "kind=${kind} version=${VERSION} sha=${SHA} (tag ${TAG})"
          {
            echo "kind=${kind}"
            echo "version=${VERSION}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Stage artifacts
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
          STAGE_DIR: ${{ runner.temp }}/site-artifacts
        run: |
          set -euo pipefail
          mkdir -p "$STAGE_DIR"
          # upload-artifact keeps directory structure relative to its search root;
          # the release job uploads a flat dir, but look recursively so a future
          # change of that layout cannot silently break the publish.
          apk="$(find "$ARTIFACT_DIR" -name 'app-release.apk' -print -quit)"
          [ -n "$apk" ] || { echo "::error::app-release.apk missing from the downloaded artifact"; exit 1; }
          cp -f "$apk" "$STAGE_DIR/app-release.apk"
          zip="$(find "$ARTIFACT_DIR" -name 'free-social-*.zip' -print -quit)"
          [ -n "$zip" ] || { echo "::error::free-social-*.zip missing from the downloaded artifact"; exit 1; }
          cp -f "$zip" "$STAGE_DIR/$(basename "$zip")"
          ls -la "$STAGE_DIR"

      - name: Publish downloads
        env:
          KIND: ${{ steps.kind.outputs.kind }}
          VERSION: ${{ steps.kind.outputs.version }}
          SHA: ${{ steps.kind.outputs.sha }}
          TAG: ${{ inputs.tag_name }}
          STAGE_DIR: ${{ runner.temp }}/site-artifacts
        run: |
          set -euo pipefail
          [ -f tools/release/publish_downloads.sh ] || {
            echo "::error::tools/release/publish_downloads.sh is missing"; exit 1;
          }
          # A nightly's site files are named nightly-<YYYYMMDD>-<sha>.  Pin that
          # date to the tag, not to "today", so a re-run on a later UTC day keeps
          # the tag date and the published filenames in agreement. The script keeps
          # an already-recorded entry's date either way; this only seeds new ones.
          if [ "$KIND" = "nightly" ]; then
            d="${TAG#nightly-}"
            d="${d%%-*}"
            export PUBLISH_DATE="${d:0:4}-${d:4:2}-${d:6:2}"
            echo "publish date: ${PUBLISH_DATE} (from ${TAG})"
          fi
          bash tools/release/publish_downloads.sh "$KIND" "$VERSION" "$SHA" "$STAGE_DIR"

      - name: Commit published downloads
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ steps.kind.outputs.kind }}
          VERSION: ${{ steps.kind.outputs.version }}
          TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          # Commit subject: the nightly tag for nightlies, the version for releases.
          if [ "$KIND" = "nightly" ]; then label="$TAG"; else label="$VERSION"; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          paths=(website/downloads)
          commit="$(git rev-parse HEAD)"
          changes="$(git status --porcelain -- "${paths[@]}")"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git add -A -- "${paths[@]}"
            staged="$(git diff --cached --name-only)"
            unexpected="$(printf '%s\n' "$staged" | grep -vE '^website/downloads/' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::refusing to commit paths outside website/downloads/:"
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            branch="chore/site-bookkeeping-${GITHUB_RUN_ID}"
            git checkout -b "$branch"
            git commit -m "chore(site): publish ${label}"
            body="$(printf '%s\n' \
              "Site downloads for ${label}, produced by the build-release workflow." \
              "" \
              "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "- files: website/downloads/ only (apk, zip, versions.json)" \
              "- landed by tools/release/bookkeeping_pr.sh: throwaway branch, PR, required build-test check, squash merge")"
            out="$(bash "${BOOKKEEPING_HELPER:?}" --branch "$branch" --title "chore(site): publish ${label}" --body "$body")"
            commit="$(printf '%s\n' "$out" | sed -n 's/^merged_sha=//p')"
            pr_url="$(printf '%s\n' "$out" | sed -n 's/^pr_url=//p')"
            if [ -z "$commit" ]; then
              echo "::error::bookkeeping_pr.sh reported no merged sha (PR: ${pr_url:-unknown})"
              exit 1
            fi
            echo "site commit: ${commit} (${pr_url})"
          else
            echo "::notice::website already up to date for ${label}; nothing to commit"
          fi

          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%s' "$commit" | cut -c1-7)" >> "$GITHUB_OUTPUT"

  # The one image-build/publish definition in the repository:
  # website-image.yml. This job only *calls* it — there is no docker login,
  # buildx or push step anywhere in this file. It builds the commit that carries
  # the freshly published downloads and gets the pushed tag back.
  site-image:
    needs: publish-site
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/website-image.yml
    secrets: inherit
    with:
      ref: ${{ needs.publish-site.outputs.commit }}
      tag: ${{ needs.publish-site.outputs.short }}

  # Pulls that image on the docker host through Portainer's docker API proxy and
  # swaps the live container: health-gated, with rollback to <container>-prev.
  # See tools/release/deploy-site.sh. The image reference comes from the
  # website-image workflow outputs, so the registry/repository name lives in
  # exactly one place (env.IMAGE in website-image.yml).
  deploy-site:
    needs: [publish-site, site-image]
    uses: ./.github/workflows/deploy-site.yml
    with:
      image: ${{ needs.site-image.outputs.image }}:${{ needs.site-image.outputs.tag }}
    secrets: inherit

