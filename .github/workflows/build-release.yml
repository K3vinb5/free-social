name: Build & Release (reusable)

# Shared delivery mechanics for release.yml (versioned release) and
# nightly.yml (commit-hash prerelease). Builds, tests, packages and publishes.
# Artifacts are signed release builds (never debug builds): the keystore is
# decoded from repository secrets on the runner and never committed.
on:
  workflow_call:
    inputs:
      tag_name:
        description: Tag to publish (created by gh at the built commit if it does not exist)
        required: true
        type: string
      release_name:
        description: Release title (defaults to the tag name)
        required: false
        type: string
        default: ""
      prerelease:
        description: Mark the release as a prerelease
        required: false
        type: boolean
        default: false
      changelog_from:
        description: Optional ref to start the changelog range at (defaults to the previous tag)
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  ANDROID_PLATFORM_PKG: "platforms;android-36"
  ANDROID_BUILD_TOOLS_PKG: "build-tools;36.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve checkout ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ] && gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "ref=refs/tags/${TAG}" >> "$GITHUB_OUTPUT"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "checking out existing tag ${TAG}"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "tag ${TAG} does not exist yet; building ${GITHUB_SHA}"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "::error::Android SDK not found at $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDK"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          [ -n "$SDKMANAGER" ] || { echo "::error::sdkmanager not found under $SDK"; exit 1; }

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # Already-installed packages make sdkmanager exit 0; tolerate its
          # stderr noise and verify the directories instead of trusting the code.
          for pkg in "$ANDROID_PLATFORM_PKG" "$ANDROID_BUILD_TOOLS_PKG"; do
            echo "Ensuring SDK package: $pkg"
            "$SDKMANAGER" "$pkg" >/dev/null 2>&1 || true
          done
          test -d "$SDK/platforms/android-36" || { echo "::error::$ANDROID_PLATFORM_PKG missing"; exit 1; }
          test -d "$SDK/build-tools/36.0.0" || { echo "::error::$ANDROID_BUILD_TOOLS_PKG missing"; exit 1; }

      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.FREE_SOCIAL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FREE_SOCIAL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FREE_SOCIAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FREE_SOCIAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=("FREE_SOCIAL_KEYSTORE_B64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("FREE_SOCIAL_KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("FREE_SOCIAL_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("FREE_SOCIAL_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing release signing secrets: ${missing[*]}"
            echo "Releases must be signed release builds, not debug builds." >&2
            echo "Set each one with: gh secret set <NAME>  (value on stdin)" >&2
            exit 1
          fi
          echo "All four release signing secrets are present."

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.FREE_SOCIAL_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/freesocial-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          test -s "$keystore" || { echo "::error::decoded keystore is empty"; exit 1; }
          echo "FREE_SOCIAL_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "Decoded the release keystore for this job."

      - name: Test and build signed release APK
        env:
          FREE_SOCIAL_KEYSTORE_FILE: ${{ runner.temp }}/freesocial-release.jks
          FREE_SOCIAL_KEYSTORE_PASSWORD: ${{ secrets.FREE_SOCIAL_KEYSTORE_PASSWORD }}
          FREE_SOCIAL_KEY_ALIAS: ${{ secrets.FREE_SOCIAL_KEY_ALIAS }}
          FREE_SOCIAL_KEY_PASSWORD: ${{ secrets.FREE_SOCIAL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test assembleRelease

      - name: Package artifact
        id: package
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "${TAG#nightly-}" != "$TAG" ]; then
            # nightly-YYYYMMDD-<sha> -> artifact named free-social-nightly-YYYYMMDD-<sha>.zip
            version="${TAG%-*}"
          else
            version="${TAG#v}"
          fi
          sha="$(git rev-parse --short HEAD)"
          zip="$(tools/release/package.sh "$version" "$sha" dist)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          unzip -l "$zip"

      - name: Compose release notes
        env:
          CHANGELOG_FROM: ${{ inputs.changelog_from }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          tools/release/changelog.sh "$CHANGELOG_FROM" "$(git rev-parse HEAD)" "$TAG_NAME" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          TAG_EXISTS: ${{ steps.ref.outputs.tag_exists }}
          ZIP: ${{ steps.package.outputs.zip }}
          APK: ${{ steps.package.outputs.apk }}
        run: |
          set -euo pipefail
          title="${RELEASE_NAME:-$TAG}"
          args=(--title "$title" --prerelease="$PRERELEASE" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$TAG_EXISTS" != "true" ]; then
            args+=(--target "$(git rev-parse HEAD)")
          fi
          gh release create "$TAG" "${args[@]}" "$ZIP" "$APK"
