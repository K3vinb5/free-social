name: Website image

# Builds website/ into a container image and publishes it to GHCR as
# ghcr.io/k3vinb5/free-social-website:<short-sha> and :latest.
# Deployed on the docker-local host behind the reverse proxy.

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/website-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: website-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/k3vinb5/free-social-website

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short sha
        id: sha
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./website
          file: ./website/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=free-social-website
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Website image pushed"
            echo ""
            echo "- \`${{ env.IMAGE }}:latest\`"
            echo "- \`${{ env.IMAGE }}:${{ steps.sha.outputs.short }}\`"
            echo "- revision \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
