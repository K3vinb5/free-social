name: Website image

# THE single image build-and-push definition in this repository: docker login,
# buildx and build-push live here and nowhere else. Two callers use it:
#   * this workflow's own push/workflow_dispatch trigger — a human change to
#     website/** on master;
#   * build-release.yml's `site-image` job via `workflow_call`, which builds the
#     commit carrying the freshly published downloads and hands the pushed tag to
#     the deploy step. Deploying (Portainer pull + container swap) is NOT here:
#     that is build-release.yml -> tools/release/deploy-site.sh.
#
# Publishes ghcr.io/k3vinb5/free-social-website:<short-sha> and :latest.
# `env.IMAGE` below is the only place the registry/repository name is spelled;
# build-release.yml consumes it through this workflow's `image` output.

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/website-image.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit/branch/tag to build (defaults to the triggering commit)
        required: false
        type: string
        default: ""
      tag:
        description: Extra image tag (defaults to the short sha of the built commit)
        required: false
        type: string
        default: ""
    outputs:
      image:
        description: Image repository without tag
        value: ${{ jobs.build-push.outputs.image }}
      tag:
        description: Tag pushed for this build
        value: ${{ jobs.build-push.outputs.tag }}
      digest:
        description: Digest of the pushed manifest
        value: ${{ jobs.build-push.outputs.digest }}

permissions:
  contents: read
  packages: write

concurrency:
  group: website-image-${{ github.event_name }}
  # A website-content push can safely supersede itself; a call from the release
  # pipeline must never be cancelled mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  IMAGE: ghcr.io/k3vinb5/free-social-website

jobs:
  build-push:
    # The release/nightly pipeline commits website/downloads + website/index.html
    # and then calls this workflow for that exact commit. Skip the push-triggered
    # duplicate for those bot commits: same commit, same tags, and the call is the
    # build deploy-site waits on.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(site): publish')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve tags
        id: meta
        env:
          IMAGE_REPO: ${{ env.IMAGE }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          short="$(printf '%s' "$revision" | cut -c1-7)"
          tag="${INPUT_TAG:-$short}"
          echo "building ${IMAGE_REPO}:${tag} from ${revision}"
          {
            echo "image=${IMAGE_REPO}"
            echo "tag=${tag}"
            echo "revision=${revision}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./website
          file: ./website/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.title=free-social-website
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Website image pushed"
            echo ""
            echo "- \`${{ steps.meta.outputs.image }}:latest\`"
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "- revision \`${{ steps.meta.outputs.revision }}\`"
            echo "- digest \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
