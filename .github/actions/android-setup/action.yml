name: Android build setup
description: >
  Single source for the Android build environment: JDK 21 (temurin, gradle cache)
  plus the Android SDK packages this repo needs. Used by ci.yml and
  build-release.yml so the setup lives in exactly one place.

inputs:
  platform-pkg:
    description: sdkmanager platform package
    default: "platforms;android-36"
  build-tools-pkg:
    description: sdkmanager build-tools package
    default: "build-tools;36.0.0"

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle

    - name: Ensure Android SDK packages
      shell: bash
      env:
        ANDROID_PLATFORM_PKG: ${{ inputs.platform-pkg }}
        ANDROID_BUILD_TOOLS_PKG: ${{ inputs.build-tools-pkg }}
      run: |
        set -euo pipefail
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        [ -d "$SDK" ] || { echo "::error::Android SDK not found at $SDK"; exit 1; }
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        echo "Using Android SDK at $SDK"

        SDKMANAGER="$(command -v sdkmanager || true)"
        if [ -z "$SDKMANAGER" ]; then
          for candidate in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
        fi
        [ -n "$SDKMANAGER" ] || { echo "::error::sdkmanager not found under $SDK"; exit 1; }

        yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
        # Already-installed packages make sdkmanager exit 0; tolerate its
        # stderr noise and verify the directories instead of trusting the code.
        for pkg in "$ANDROID_PLATFORM_PKG" "$ANDROID_BUILD_TOOLS_PKG"; do
          echo "Ensuring SDK package: $pkg"
          "$SDKMANAGER" "$pkg" >/dev/null 2>&1 || true
        done
        test -d "$SDK/platforms/android-36" || { echo "::error::$ANDROID_PLATFORM_PKG missing"; exit 1; }
        test -d "$SDK/build-tools/36.0.0" || { echo "::error::$ANDROID_BUILD_TOOLS_PKG missing"; exit 1; }
